# Where `python scripts/deploy.py upload` sends the game.
# Copy to scripts/deploy.ini (the first upload does it for you) and fill it in there.
# deploy.ini is gitignored, this file is not: never put a login in this one.

[host]
# The FTP details from the host's panel, the same ones FileZilla uses
protocol = ftp
host =
port = 21
user =
# Leave empty to be asked on every upload, or set AURORA_DEPLOY_PASSWORD
password =
# The server folder on the host, the one holding plugins/ and world/
root = /

[worlds]
# The folder the worlds are in, the same on LocalServer and on the host
folder = world/dimensions/minecraft
# Only these are sent by --worlds. The vanilla overworld, nether and end are not
names = aurora_mines, aurora_test, aurora_test_gormak

[build]
mvn = C:/Program Files/JetBrains/IntelliJ IDEA 2025.3.1.1/plugins/maven-plugin/lib/maven3/bin/mvn.cmd
jdk = C:/Users/Chill/.jdks/openjdk-25.0.1
