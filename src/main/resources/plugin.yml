name: Aurora
version: '0.2'
main: org.charky.aurora.core.Aurora
api-version: '1.21'
authors: [ Charky ]
description: AuroraMines server plugin - skymining
commands:
  refresh:
    description: Refresh databases
    usage: /refresh
    permission: aurora.admin
  aurora:
    description: Open the Aurora menu, admins also get the subcommands
    usage: /aurora [mine|spawner|trader|portal|world|wand|setspawn|tutorial|access|heal|help|info]
    aliases: [a, aura]
  spawn:
    description: Teleport to world spawn
    usage: /spawn
  backpack:
    description: Open the backpack
    usage: /backpack
    aliases: [bp]
  dump:
    description: Give shulkers of every registry item, or clear your backpack and inventory
    usage: /dump [items|icons|all|clear]
    permission: aurora.admin
  ranks:
    description: Choose the rank shown by your name
    usage: /ranks
    aliases: [ rank ]
  customise:
    description: Ranks, suffixes, colours, join messages, trails and kill effects
    usage: /customise
    aliases: [ customize, cosmetics ]
  leaderboard:
    description: The ten highest levels on the server
    usage: /leaderboard
  trash:
    description: A bin, whatever is left in it when closed is deleted
    usage: /trash
  shop:
    description: The Essence shop, dash, double jump, mounts and ranks
    usage: /shop
  dash:
    description: The Dash Feather again, once Dash is bought
    usage: /dash
  tutorial:
    description: Skip the first-join tutorial
    usage: /tutorial skip
  collections:
    description: Every resource you have gathered and what the next milestone pays
    usage: /collections
    aliases: [ collection ]
permissions:
  aurora.admin:
    description: Admin and testing commands
    default: op
