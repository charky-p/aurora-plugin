# Builds and tests every push and pull request
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The generated YAML must match the CSVs, the CSVs are the source of truth
      - name: Check generated YAML is up to date
        run: |
          pip install pyyaml==6.0.2
          python scripts/generate.py --check

      # package also runs the tests
      - name: Build and test
        run: mvn -B package
