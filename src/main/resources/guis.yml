# ===========================================================
# AURORA GUI TEMPLATE
# ===========================================================
# [gui_id]:
#   title: "<color><b><i>Gui Title"
#   icon: [icon_id] (Default null)
#   rows: 3 (Default)
#   layout: (Must be same amount as rows)
#     - "BBBBIBBBX" (B: Border, I: Info, X: Close)
#     - "B 1 a b B" (Distinct characters map to Guis or trades, e.g. 0-9, a-z)
#     - "BBBBBBBBB"
#   components:
#     '1':
#       type: GUI
#       id: [gui_id]
#     'a':
#       type: TRADE
#       id: [item_id]
#       amount: 1 (Default)
#       cost: (Optional)
#         - id: [item_id]
#           amount: 1 (Default)
#     'b': ...
# ===========================================================

items:
  cobble_shop:
    title: "<gray><b>Cobblestone Shop"
    layout:
      - "BBBBIBBBX"
      - "BB1B2B3BB"
      - "BBBBBBBBB"
    components:
      '1':
        type: GUI
        id: cobble_tools
      '2':
        type: GUI
        id: cobble_armor
      '3':
        type: GUI
        id: cobble_compressor

  cobble_tools:
    title: "<gray><b>Cobblestone Tools"
    icon: cobble_tools
    rows: 5
    layout:
      - "BBBBBBBBB"
      - "B1234   B"
      - "B       B"
      - "B       B"
      - "BBBBBBBBB"
    components:
      '1':
        type: TRADE
        id: starter_pick
      '2':
        type: TRADE
        id: cobble_pick_1
        cost:
          - id: starter_pick
          - id: cobblestone
            amount: 16
      '3':
        type: TRADE
        id: cobble_pick_2
        cost:
          - id: cobble_pick_1
          - id: cobblestone
            amount: 32
      '4':
        type: TRADE
        id: cobble_pick_3
        cost:
          - id: cobble_pick_2
          - id: cobblestone
            amount: 48

  cobble_armor:
    title: "<gray><b>Cobblestone Armor"
    icon: cobble_armor
    layout:
      - "BBBBIBBBX"
      - "B   1   B"
      - "BBBBBBBBB"
    components:
      '1':
        type: GUI
        id: cobble_shop

  cobble_compressor:
    title: "<gray><b>Cobblestone Compressor"
    icon: cobble_tools
    layout:
      - "BBBBIBBBX"
      - "B   1   B"
      - "BBBBBBBBB"
    components:
      '1':
        type: GUI
        id: cobble_shop
