# Builds and tests every push and pull request
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The generated YAML must match the CSVs, the CSVs are the source of truth
      - name: Check generated YAML is up to date
        run: |
          pip install pyyaml==6.0.2
          python scripts/generate.py --check

      # package also runs the tests
      - name: Build and test
        run: mvn -B package

      # The plugin jar, ready to drop into a server's plugins folder
      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: aurora-plugin
          path: |
            target/Aurora-*.jar
            !target/*-shaded.jar
          retention-days: 30
