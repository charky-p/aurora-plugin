
# ===========================================================
# AURORA MOB TEMPLATE
# ===========================================================
# [mob_id]:
#   display: "<color><b><i>Display Name"
#   entity: [BUKKIT_ENTITY_TYPE]
#   equip: (Optional)
#     head: [item_id] (Optional, item_id = gear_id or resource_id)
#     chest: [item_id] (Optional)
#     legs: [item_id] (Optional)
#     feet: [item_id] (Optional)
#     hand: [item_id] (Optional)
#     off_hand: [item_id] (Optional)
#   attributes: (Optional)
#     - attr: [BUKKIT_ATTRIBUTE]
#       value: 1
#   independent: (Optional - Every drop roll is independent)
#     - id: [item_id]
#       chance: 100 (Default)
#       min: 1 (Default)
#       max: 1 (Default)
#   choices: (Optional - Picks one drop)
#     chance: 100 (Default)
#     options:
#       - id: [item_id]
#         weight: 50
# ===========================================================

items:
  gormak_minion:
    display: "<dark_gray><b>Gormak Minion"
    entity: HUSK
    equip:
      head: leather_helmet
      chest: iron_chestplate
      legs: leather_leggings
      feet: leather_boots
      hand: wooden_sword
    attributes:
      - attr: MAX_HEALTH
        value: 30.0
    independent:
      - id: ancient_flesh
        max: 6

  gormak_bowman:
    display: "<gray><b>Gormak Bowman"
    entity: SKELETON
    equip:
      head: iron_helmet
      chest: gold_chestplate
      hand: bow
    attributes:
      - attr: MAX_HEALTH
        value: 35.0
    independent:
      - id: ancient_bone
        max: 4

  gormak_guard:
    display: "<yellow><b>Gormak Guard"
    entity: HUSK
    equip:
      head: iron_helmet
      chest: gold_chestplate
      legs: iron_leggings
      feet: iron_boots
      hand: iron_sword
      off_hand: shield
    attributes:
      - attr: MAX_HEALTH
        value: 60.0
    independent:
      - id: gormak_sword
        chance: 1
      - id: ancient_nugget
        min: 5
        max: 13

  void_gormak_shaman:
    display: "<black><b>Void-Infused Shaman"
    entity: WITHER_SKELETON
    equip:
      chest: gormak_chest
    attributes:
      - attr: MAX_HEALTH
        value: 100.0
      - attr: MOVEMENT_SPEED
        value: 0.25
      - attr: KNOCKBACK_RESISTANCE
        value: 1.0
      - attr: FOLLOW_RANGE
        value: 48.0
      - attr: ATTACK_DAMAGE
        value: 8.0
    independent:
      - id: coal
      - id: gold
        min: 5
        max: 12

