name: Aurora
version: '0.3'
main: org.charky.aurora.core.Aurora
api-version: '1.21'
authors: [ Charky ]
description: AuroraMines server plugin - skymining
commands:
  refresh:
    description: Refresh databases
    usage: /refresh
    permission: aurora.admin
  aurora:
    description: Open the Aurora menu, admins also get the subcommands
    usage: /aurora [mine|spawner|trader|portal|world|wand|setspawn|tutorial|access|heal|help|info]
    aliases: [a, aura]
  spawn:
    description: Teleport to world spawn
    usage: /spawn
  backpack:
    description: Open the backpack
    usage: /backpack
    aliases: [bp]
  dump:
    description: Give shulkers of every registry item, or clear your backpack and inventory
    usage: /dump [items|icons|all|clear]
    permission: aurora.admin
  ranks:
    description: Choose the rank shown by your name
    usage: /ranks
    aliases: [ rank ]
  playtime:
    description: How long you or another player has played, and the time to the next playtime rank
    usage: /playtime [player]
  customise:
    description: Ranks, suffixes, colours, join messages, trails and kill effects
    usage: /customise
    aliases: [ customize, cosmetics ]
  leaderboard:
    description: The ten highest levels on the server
    usage: /leaderboard
  trash:
    description: A bin, whatever is left in it when closed is deleted
    usage: /trash
  shop:
    description: The Essence shop, dash, double jump, mounts and ranks
    usage: /shop
  dash:
    description: The Dash Feather again, once Dash is bought
    usage: /dash
  tutorial:
    description: Skip the first-join tutorial
    usage: /tutorial skip
  gauntlet:
    description: Go to the Gauntlet, or open its menu there
    usage: /gauntlet [start [floor]|forge|talents|duel <player>|boon|leave]
  collections:
    description: Every resource you have gathered and what the next milestone pays
    usage: /collections
    aliases: [ collection ]
  discord:
    description: A link to the Aurora Discord
    usage: /discord
  suggest:
    description: Send an idea for the server to the staff
    usage: /suggest <your idea>
  mute:
    description: Mute a player (mods step up 15m, 1h, 1d, 3d, then a week; admins pick the length)
    usage: /mute <player> [length|perm] [reason]
    permission: aurora.mod
  unmute:
    description: Lift a player's mute
    usage: /unmute <player>
    permission: aurora.mod
  kick:
    description: Kick a player off the server
    usage: /kick <player> [reason]
    permission: aurora.mod
  ban:
    description: Ban a player, forever without a length
    usage: /ban <player> [length|perm] [reason]
    permission: aurora.admin
  unban:
    description: Lift a player's ban
    usage: /unban <player>
    permission: aurora.admin
  history:
    description: Every mute, ban and kick a player has had
    usage: /history <player>
    permission: aurora.mod
permissions:
  aurora.mod:
    description: Moderation, mute with the escalating ladder, kick, history
    default: op
  aurora.builder:
    description: The game setup commands under /aurora, Axiom and WorldEdit
    default: op
  aurora.admin:
    description: Admin and testing commands, ban, and everything mods and builders have
    default: op
    children:
      aurora.mod: true
      aurora.builder: true
