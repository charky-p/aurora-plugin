
# ===========================================================
# AURORA GUI TEMPLATE
# ===========================================================
# [gui_id]:
#   title: "<color><b><i>Gui Title"
#   icon: [icon_id] (Default null)
#   rows: 3 (Default)
#   layout: (Must be same amount as rows)
#     - "BBBBIBBBX" (B: Border, I: Info, X: Close)
#     - "B 1 a b B" (Distinct characters map to Guis or trades, e.g. 0-9, a-z)
#     - "BBBBBBBBB"
#   components:
#     '1':
#       type: GUI
#       id: [gui_id]
#     'a':
#       type: TRADE
#       id: [item_id]
#       amount: 1 (Default)
#       cost: (Optional)
#         - id: [item_id]
#           amount: 1 (Default)
#     'b': ...
# ===========================================================

items:
  starter_shop:
    title: "<gray><b>Starter Shop"
    rows: 3
    layout:
      - "BBBBIBBBX"
      - "BB1BBB2BB"
      - "BBBBBBBBB"
    components:
      '1':
        type: TRADE
        id: starter_pick_1
        cost: []
      '2':
        type: TRADE
        id: starter_sword_1
