# ===========================================================
# AURORA GUI TEMPLATE - generated from CSV
# ===========================================================
# [gui_id]:
#   title: "<color><b><i>Gui Title"
#   icon: [icon_id] (Default null)
#   rows: 3 (Default)
#   layout: (Must be same amount as rows)
#     - "BBBBIBBBX" (B: Border, I: Info, X: Close)
#     - "B 1 a b B" (Distinct characters map to Guis or trades, e.g. 0-9, a-z)
#     - "BBBBBBBBB"
#   components:
#     '1':
#       type: GUI
#       id: [gui_id]
#     'a':
#       type: TRADE
#       id: [item_id]
#       amount: 1 (Default)
#       cost: (Optional)
#         - id: [item_id]
#           amount: 1 (Default)
#     'b': ...
# ===========================================================
# DO NOT EDIT BY HAND -- run `python generate.py`
# ===========================================================

items:
  starter_shop:
    title: "<gold><b>Starter Gear"
    icon: icon_starter
    rows: 3
    layout:
      - "BBBBIBBBB"
      - "B   1   B"
      - "BBBBBBBBX"
    components:
      '1':
        type: ACTION
        id: tools
        icon: icon_tools

  gate_shop:
    title: "<gold><b>Gormak Gate"
    icon: icon_gormak
    rows: 3
    layout:
      - "BBBBIBBBB"
      - "B   1   B"
      - "BBBBBBBBX"
    components:
      '1':
        type: TRADE
        id: gormak_key
        cost:
          - id: gold
            amount: 300
          - id: leather
            amount: 20

  tomb_shop:
    title: "<gold><b>Royal Tomb"
    icon: icon_tomb
    rows: 3
    layout:
      - "BBBBIBBBB"
      - "B  u U  B"
      - "BBBBBBBBX"
    components:
      u:
        type: ACTION
        id: upgrades:tomb
        icon: icon_upgrades
      U:
        type: GUI
        id: tomb_utility

  tomb_utility:
    title: "<gold><b>Royal Tomb <dark_gray>| <gray>Utility"
    icon: icon_utility
    rows: 3
    layout:
      - "BBBBIBBBB"
      - "B  12   B"
      - "zBBBBBBBX"
    components:
      '1':
        type: TRADE
        id: totem
        cost:
          - id: ancient_nugget
            amount: 170
          - id: eternal_soul
            amount: 5
      '2':
        type: TRADE
        id: gormak_talisman
        cost:
          - id: ancient_heart
            amount: 3
          - id: royal_seal
            amount: 5
      z:
        type: GUI
        id: tomb_shop

  aurora_hub:
    title: "<aqua><b>Aurora"
    icon: icon_menu
    rows: 6
    layout:
      - "BBBBBBBBB"
      - "B       B"
      - "B 1 4 6 B"
      - "B  7 w  B"
      - "B   9   B"
      - "BBBBBBBBX"
    components:
      '1':
        type: ACTION
        id: howto
        icon: icon_howto
      '4':
        type: ACTION
        id: backpack
        icon: icon_backpack
      '6':
        type: ACTION
        id: collections
        icon: icon_collections
      '7':
        type: ACTION
        id: customise
        icon: icon_customise
      '9':
        type: ACTION
        id: spawn
        icon: icon_spawn
      w:
        type: ACTION
        id: warps
        icon: icon_warps

  food_shop:
    title: "<gold><b>Camp Cook"
    icon: icon_food
    rows: 3
    layout:
      - "BBBBBBBBB"
      - "B12345  B"
      - "BBBBBBBBX"
    components:
      '1':
        type: TRADE
        id: bread
        amount: 64
        cost:
          - id: cobblestone
            amount: 16
      '2':
        type: TRADE
        id: baked_potato
        amount: 64
        cost:
          - id: coal
            amount: 32
      '3':
        type: TRADE
        id: cooked_chicken
        amount: 64
        cost:
          - id: iron
            amount: 48
      '4':
        type: TRADE
        id: steak
        amount: 64
        cost:
          - id: gold
            amount: 64
      '5':
        type: TRADE
        id: golden_carrot
        amount: 64
        cost:
          - id: raw_gold
            amount: 128
