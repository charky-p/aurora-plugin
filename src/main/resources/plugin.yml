name: Aurora
version: '1.0'
main: org.charky.aurora.Aurora
api-version: '1.21'
authors: [ Charky ]
description: AuroraMines server plugin - skymining
commands:
  refresh:
    description: Refresh databases
    usage: /refresh
  getCustoms:
    description: Get custom made items for testing purposes
    usage: /getCustoms
  heal:
    description: Restores health, hunge and removes fire ticks
    usage: /heal [player]
  mine:
    description: Main command for aurora mines creation.
    usage: /mine [add|delete|list|setblocks|reset|tp]
    aliases: [m, mines]
  mobspawner:
    description: Main command for mob and spawner creations.
    usage: /mobspawner [add|save]
    aliases: [ms, mobspawners]
  trader:
    description: Spawn trader
    usage: /trader <traderId> <x> <y> <z>
    aliases: [t]
  wandE:
    description: wand entities
    usage: /wande