    material: GOLD_NUGGET
    world: "overworld"
    region: "origin_isles"

  cobblestone:
    display: "<gray><b>Cobblestone"
    material: COBBLESTONE
    world: "overworld"
    region: "origin_isles"

  coal:
    display: "<gray><b>Coal"
    material: COAL
    world: "overworld"
    region: "origin_isles"

  copper:
    display: "<gray><b>Copper"
    material: COPPER_INGOT
    world: "overworld"
    region: "origin_isles"

  iron:
    display: "<gray><b>Iron"
    material: IRON_INGOT
    world: "overworld"
