name: Aurora
version: '1.0'
main: org.charky.aurora.core.Aurora
api-version: '1.21'
authors: [ Charky ]
description: AuroraMines server plugin - skymining
commands:
  refresh:
    description: Refresh databases
    usage: /refresh
  getCustoms:
    description: Get custom made items for testing purposes
    usage: /getCustoms
  heal:
    description: Restores health, hunge and removes fire ticks
    usage: /heal [player]
  aurora:
    description: Main command for all aurora admin commands
    usage: /aurora [mine|mob|trader|wand]
    aliases: [a, aura]
  spawn:
    description: Teleport to world spawn
    usage: /spawn
worlds:
  aurora_mines:
    generator: Aurora
