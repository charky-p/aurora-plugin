name: Aurora
version: '1.0'
main: org.charky.aurora.core.Aurora
api-version: '1.21'
authors: [ Charky ]
description: AuroraMines server plugin - skymining
commands:
  refresh:
    description: Refresh databases
    usage: /refresh
    permission: aurora.admin
  aurora:
    description: Open the Aurora menu, admins also get the subcommands
    usage: /aurora [mine|spawner|trader|portal|world|wand|setspawn|heal|help|info]
    aliases: [a, aura]
  spawn:
    description: Teleport to world spawn
    usage: /spawn
  gauntlet: # admin only and hidden from players while in progress, it clears the inventory
    description: Gauntlet gamemode
    usage: /gauntlet
    permission: aurora.admin
  backpack:
    description: Open the backpack
    usage: /backpack
    aliases: [bp]
  dump: # TODO
    description: Give shulkers of every registry item
    usage: /dump [items|icons|all]
    permission: aurora.admin
  menu:
    description: Open the main Aurora menu
    usage: /menu
    aliases: [ hub ]
permissions:
  aurora.admin:
    description: Admin and testing commands
    default: op
