# ===========================================================
# AURORA GUI TEMPLATE - generated from CSV
# ===========================================================
# [gui_id]:
#   title: "<color><b><i>Gui Title"
#   icon: [icon_id] (Default null)
#   rows: 3 (Default)
#   layout: (Must be same amount as rows)
#     - "BBBBIBBBX" (B: Border, I: Info, X: Close)
#     - "B 1 a b B" (Distinct characters map to Guis or trades, e.g. 0-9, a-z)
#     - "BBBBBBBBB"
#   components:
#     '1':
#       type: GUI
#       id: [gui_id]
#     'a':
#       type: TRADE
#       id: [item_id]
#       amount: 1 (Default)
#       cost: (Optional)
#         - id: [item_id]
#           amount: 1 (Default)
#     'b': ...
# ===========================================================
# DO NOT EDIT BY HAND -- run `python generate.py`
# ===========================================================

items:
  cobble_armor:
    title: "<gray><b>Cobblestone Armor"
    icon: cobble_armor
    rows: 3
    layout:
      - "BBBBIBBBX"
      - "B   1   B"
      - "BBBBBBBBB"
    components:
      '1':
        type: GUI
        id: cobble_shop
