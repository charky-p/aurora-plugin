# ===========================================================
# AURORA BLOCK TEMPLATE - generated from data/blocks.csv
# ===========================================================
# [block_id]:
#   material: [BUKKIT_MATERIAL]
#   density: 0 (Default, subtracts from fortune)
#   independent: (Optional - Every drop roll is independent)
#     - id: [resource_id]
#       chance: 100 (Default)
#       min: 1 (Default)
#       max: 1 (Default)
#
#   choices: (Optional - Picks one drop)
#     chance: 100 (Default)
#     options:
#       - id: [resource_id]
#         weight: 50
#         min: 1 (Default)
#         max: 1 (Default)
# ===========================================================
# DO NOT EDIT BY HAND -- run `python generate.py`
# ===========================================================

items:
  cobblestone:
    material: COBBLESTONE
    independent:
      - id: cobblestone

  stone:
    material: STONE
    independent:
      - id: cobblestone
        min: 2
        max: 4

  coal_ore:
    material: COAL_ORE
    independent:
      - id: coal

  coal_block:
    material: COAL_BLOCK
    independent:
      - id: coal
        min: 5
        max: 9

  copper_ore:
    material: COPPER_ORE
    density: 1
    independent:
      - id: copper

  copper_block:
    material: COPPER_BLOCK
    density: 1
    independent:
      - id: copper
        min: 5
        max: 9

  iron_ore:
    material: IRON_ORE
    density: 2
    independent:
      - id: iron

  iron_block:
    material: IRON_BLOCK
    density: 2
    independent:
      - id: iron
        min: 5
        max: 9

  gold_ore:
    material: GOLD_ORE
    density: 3
    independent:
      - id: gold

  gold_block:
    material: GOLD_BLOCK
    density: 3
    independent:
      - id: gold
        min: 5
        max: 9

  carved_brick:
    material: STONE_BRICKS
    density: 4
    independent:
      - id: carved_brick

  cracked_brick:
    material: CRACKED_STONE_BRICKS
    density: 4
    independent:
      - id: carved_brick
        min: 2
        max: 4

  sunbaked_sand:
    material: SANDSTONE
    density: 5
    independent:
      - id: sunbaked_sand

  cut_sunbaked_sand:
    material: CUT_SANDSTONE
    density: 5
    independent:
      - id: sunbaked_sand
        min: 2
        max: 4

  crimson_sand:
    material: RED_SANDSTONE
    density: 6
    independent:
      - id: crimson_sand

  cut_crimson_sand:
    material: CUT_RED_SANDSTONE
    density: 6
    independent:
      - id: crimson_sand
        min: 2
        max: 4

  raw_gold_block:
    material: RAW_GOLD_BLOCK
    density: 7
    independent:
      - id: raw_gold

  gilded_stone:
    material: GOLD_BLOCK
    density: 7
    independent:
      - id: raw_gold
        min: 2
        max: 4
