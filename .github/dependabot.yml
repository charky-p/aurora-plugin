# Weekly pull requests for outdated dependencies, minor and patch bumps grouped
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Must match the server jar in LocalServer, updated by hand together
      - dependency-name: io.papermc.paper:paper-api

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
