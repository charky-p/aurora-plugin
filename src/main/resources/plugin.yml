name: Aurora
version: '1.0'
main: org.charky.aurora.core.Aurora
api-version: '1.21'
authors: [ Charky ]
description: AuroraMines server plugin - skymining
commands:
  refresh:
    description: Refresh databases
    usage: /refresh
    permission: aurora.admin
  aurora:
    description: Open the Aurora menu, admins also get the subcommands
    usage: /aurora [mine|spawner|trader|portal|world|wand|setspawn|heal|help|info]
    aliases: [a, aura]
  spawn:
    description: Teleport to world spawn
    usage: /spawn
  gauntlet: # admin only and hidden from players while in progress, it clears the inventory
    description: Gauntlet gamemode
    usage: /gauntlet
    permission: aurora.admin
  backpack:
    description: Open the backpack
    usage: /backpack
    aliases: [bp]
  dump:
    description: Give shulkers of every registry item, or clear your backpack and inventory
    usage: /dump [items|icons|all|clear]
    permission: aurora.admin
  menu:
    description: Open the main Aurora menu
    usage: /menu
    aliases: [ hub ]
  shop:
    description: Spend Essence on ranks
    usage: /shop
  ranks:
    description: Choose the rank shown by your name
    usage: /ranks
    aliases: [ rank, customise, customize ]
  collections:
    description: Every resource you have gathered and what the next milestone pays
    usage: /collections
    aliases: [ collection ]
permissions:
  aurora.admin:
    description: Admin and testing commands
    default: op
